<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Position Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>My Fixed Header</header>
  
  <div class="container">
    <aside class="sidebar">Sticky Sidebar</aside>
    <main class="content">
      <p>Lots of scrollable content here...</p>
      <button id="openModal">Open Modal</button>
    </main>
  </div>
  
  <div class="modal" id="modal">
    <div class="modal-content">
      <span id="closeModal">&times;</span>
      <p>This is a centered modal!</p>
    </div>
  </div>
</body>
</html>
